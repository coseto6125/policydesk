services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: policydesk
      POSTGRES_USER: policydesk
      POSTGRES_PASSWORD: policydesk
    ports:
      # 5434 keeps this clear of a local Postgres on 5432 and of enoract's on 5433.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs these once, on an empty data directory only. Recreating the
      # volume is what re-applies a changed migration.
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policydesk -d policydesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  desk:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://policydesk:policydesk@postgres:5432/policydesk
      LOG_LEVEL: INFO
      # Unset mints a token per boot and logs it — read it with
      # `docker compose logs desk | grep desk_token_generated`. Set it here to keep
      # the back office reachable at the same token across restarts.
      POLICYDESK_DESK_TOKEN: ${POLICYDESK_DESK_TOKEN:-}
      # Without a key the agent says it cannot reach its model rather than inventing
      # an answer about someone's policy.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POLICYDESK_MODEL: ${POLICYDESK_MODEL:-gpt-5.6-luna}
      # Two ONNX exports, neither in the image — they are 570 MB and 544 MB, and a
      # contract corpus is not the place to ship model weights. Unset, each channel
      # logs that it is skipped and the desk answers with the one that is left: BM25
      # alone, with no reranking. That is a working demo and a measurably worse one,
      # so point these at the exports and mount them below.
      POLICYDESK_EMBED_MODEL: ${POLICYDESK_EMBED_MODEL:-/models/bge-m3-int8-pkg}
      POLICYDESK_RERANK_MODEL: ${POLICYDESK_RERANK_MODEL:-/models/bge-reranker-v2-m3-onnx}
    volumes:
      # Read-only: the desk loads these and never writes them. Set MODELS_DIR to the
      # directory holding both exports; the default leaves the mount empty and the
      # desk starts anyway.
      - ${MODELS_DIR:-./data/models}:/models:ro
    ports:
      - "8100:8100"

  # Corpus ingestion, run on demand rather than at startup: it fetches 1.19 GB from
  # the insurer and takes about twenty minutes.
  #
  #   docker compose run --rm ingest
  #
  # It mounts ./data read-write because that is where the PDFs land. The desk service
  # deliberately does not mount it — the desk reads contracts out of Postgres, and a
  # container holding members' national IDs has no reason to also hold the corpus.
  ingest:
    build: .
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://policydesk:policydesk@postgres:5432/policydesk
    volumes:
      - ./data:/app/data
    # Fetch, parse, load — one command. The load half used to be missing: this imported
    # `copy_corpus` and `build_catalog` and ran neither, so the documented rebuild
    # downloaded 1.19 GB of contracts and stopped, every parser correction reaching
    # SQLite and no further while Postgres kept whatever it already held.
    command: policydesk-ingest --fetch /app/data/cathay

volumes:
  pgdata:
