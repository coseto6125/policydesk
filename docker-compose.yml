services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: policydesk
      POSTGRES_USER: policydesk
      POSTGRES_PASSWORD: policydesk
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policydesk -d policydesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  desk:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://policydesk:policydesk@postgres:5432/policydesk
      LOG_LEVEL: INFO
    ports:
      - "8100:8100"
    volumes:
      # The contract corpus is 1.19 GB of the insurer's copyright, so it stays out of
      # the image and is mounted from the host.
      - ./data:/app/data:ro

volumes:
  pgdata:
