# OCI deployment: no model weights, no OpenAI key, no LAN encoder.
#
# The base compose file is written for a workstation that can reach an operator-run
# llama-server and can mount 1.1 GB of ONNX exports. A cloud host has neither, so both
# channels move to hosted APIs: embeddings and reranking to Cloudflare Workers AI,
# the answering model to Claude Haiku over the Anthropic Messages API.
#
#   docker compose -f docker-compose.yml -f docker-compose.oci.yml up -d desk
#
# Postgres keeps the base file's definition; the corpus arrives as a pg_restore dump
# rather than through the ingest service, which needs the insurer's PDFs.

services:
  desk:
    environment:
      # Embeddings and reranking. The vector index records which backend built it, so
      # a mismatch here raises rather than answering from vectors the encoder did not
      # produce. POLICYDESK_EMBED_URL stays unset: setting it would select the
      # llama-server backend and reach for a private address this host cannot see.
      POLICYDESK_EMBED_URL: ""
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?set in .env}
      CLOUDFLARE_AUTH_TOKEN: ${CLOUDFLARE_AUTH_TOKEN:?set in .env}
      POLICYDESK_CF_MODEL: ${POLICYDESK_CF_MODEL:-@cf/baai/bge-m3}

      # The answering model. The subscription OAuth token is read from a file rather
      # than an environment variable because it rotates: Claude Code refreshes it in
      # the background and the desk re-reads the file near expiry. Refreshing it here
      # would invalidate the copy that Claude Code holds, so this path is read-only.
      ANTHROPIC_OAUTH_CREDS_PATH: /run/secrets/anthropic-token.json
      POLICYDESK_MODEL: ${POLICYDESK_MODEL:-claude-haiku-4-5}

      # Unset, the desk mints a token per boot and logs it. Set it to keep the back
      # office reachable at one token across restarts.
      POLICYDESK_DESK_TOKEN: ${POLICYDESK_DESK_TOKEN:-}

      # Neither ONNX export ships to this host. Empty selects the hosted channels
      # above instead of a missing local model.
      POLICYDESK_EMBED_MODEL: ""
      POLICYDESK_RERANK_MODEL: ""

      # An OpenAI key would outrank nothing here — the provider order puts the
      # Anthropic credential file first — but leaving it unset keeps the fallback
      # chain honest about what this deployment actually runs on.
      OPENAI_API_KEY: ""

    volumes:
      # The directory, read-only, not the file inside it. A bind mount of a file binds an
      # inode, and the sync writes a temporary file and renames it — a new inode — so the
      # container kept reading the copy that was there when it started. The host held a
      # current token, the sync logged success every half hour, and every customer turn
      # came back 櫃台的語言服務目前無回應 once the mounted copy was revoked. Mounting the
      # directory makes a replacement visible without a restart, which is the whole point
      # of syncing a credential that rotates.
      - ${ANTHROPIC_TOKEN_DIR:?directory holding a copy of ~/.claude/.credentials.json as anthropic-token.json}:/run/secrets:ro
      # The prebuilt vector index. Rebuilding 15,824 passages on the host would spend
      # Workers AI quota to reproduce bytes the workstation already has.
      - ./data/vectors:/app/data/vectors:ro
      # BM25 rebuilds its index at every boot in about two minutes, so it needs
      # somewhere writable but nothing durable. A named volume mounts as root-owned
      # and the image runs as uid 10001, so the first write fails and the desk loses
      # its lexical channel; tmpfs at 1777 — /tmp's own mode — takes the write and
      # disappears with the container, which is what a rebuilt cache wants.
      - type: tmpfs
        target: /app/data/bm25
        tmpfs:
          mode: 0o1777

    ports:
      # Bound to loopback: the public entrance is the Cloudflare tunnel, so the port
      # itself needs no exposure on the host's own interface.
      - "127.0.0.1:8101:8100"

