name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: policydesk-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  static:
    name: "Syntax · Imports · Lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # These two read source and resolve nothing, so they run before the install: a
      # broken lockfile still gets a syntax answer rather than failing ahead of the
      # check that would have explained it.
      - name: Syntax
        run: uvx pyci-check@0.3.5 syntax src/ tests/

      - name: Lint
        run: uvx ruff check src/ tests/

      # The imports check resolves each import against an environment. Run bare it
      # reports every third-party module as missing — 23 modules, 61 errors, none of
      # them real. What it is here to catch is the opposite case: a module that is
      # imported and not declared, which is only visible once the declared ones are
      # installed. `pypdfium2` was exactly that, arriving through `pdfplumber` until
      # someone dropped it.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Imports
        run: uv run --with pyci-check==0.3.5 pyci-check imports src/

      # Reported, never enforced: the dead-code scan cannot tell a public API from an
      # orphan, and every Sanic route handler reads as one.
      - name: Cycles and dead code (advisory)
        continue-on-error: true
        run: |
          uvx pyci-check@0.3.5 cycles src/
          uvx pyci-check@0.3.5 deadcode src/

  test:
    name: "Test"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # No database and no network. Everything this desk does that matters runs against
      # the insurer's contract PDFs and the statute corpus, and neither travels with the
      # repository: a Postgres service here holds an empty schema, so the suite reported
      # 84 failures and 103 errors that all said the same thing — the data is not here.
      # That is not a signal, and a red build that is always red is read as noise.
      #
      # What runs is what needs neither: the parsers, the clause-id readers, the prompt
      # assembly, the promise and citation screens, the page's own renderers under node.
      # `POLICYDESK_TEST_NO_DB` makes the database fixture skip instead of fail, so a
      # developer whose database is merely down still gets told.
      #
      # `-rs` prints the skip list. A run that skips half the suite must not read as a
      # pass, and the only thing that makes that visible is the count.
      - name: Test
        env:
          POLICYDESK_TEST_NO_DB: "1"
        run: uv run pytest -q -rs -p no:randomly
