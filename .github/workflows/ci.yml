name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: policydesk-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"

jobs:
  static:
    name: "Syntax · Imports · Lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # These two read source and resolve nothing, so they run before the install: a
      # broken lockfile still gets a syntax answer rather than failing ahead of the
      # check that would have explained it.
      - name: Syntax
        run: uvx pyci-check@0.3.5 syntax src/ tests/

      - name: Lint
        run: uvx ruff check src/ tests/

      # The imports check resolves each import against an environment. Run bare it
      # reports every third-party module as missing — 23 modules, 61 errors, none of
      # them real. What it is here to catch is the opposite case: a module that is
      # imported and not declared, which is only visible once the declared ones are
      # installed. `pypdfium2` was exactly that, arriving through `pdfplumber` until
      # someone dropped it.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Imports
        run: uv run --with pyci-check==0.3.5 pyci-check imports src/

      # Reported, never enforced: the dead-code scan cannot tell a public API from an
      # orphan, and every Sanic route handler reads as one.
      - name: Cycles and dead code (advisory)
        continue-on-error: true
        run: |
          uvx pyci-check@0.3.5 cycles src/
          uvx pyci-check@0.3.5 deadcode src/

  test:
    name: "Test"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: policydesk
          POSTGRES_USER: policydesk
          POSTGRES_PASSWORD: policydesk
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U policydesk -d policydesk"
          --health-interval 3s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # A real Postgres rather than a list of which test files avoid one. That list
      # goes stale the first time a test grows a query, and it goes stale silently:
      # the file drops out of CI and still reports green.
      - name: Migrate
        env:
          PGPASSWORD: policydesk
        run: |
          for f in infra/migrations/*.sql; do
            psql -h 127.0.0.1 -p 5434 -U policydesk -d policydesk -v ON_ERROR_STOP=1 -f "$f"
          done

      # Corpus-dependent tests skip on an empty database, which is correct here: the
      # contract PDFs are the insurer's and do not travel with the repository. The
      # skip count is printed so a run that skips half the suite does not read as a
      # pass — `-rs` is what makes that visible.
      - name: Test
        env:
          DATABASE_URL: postgres://policydesk:policydesk@127.0.0.1:5434/policydesk
        run: uv run pytest -q -rs -p no:randomly
