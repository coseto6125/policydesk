<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保險櫃台 policydesk</title>
<style>
  /*
    Two rooms, one screen. The left is a back office: dense, quiet, instrumented,
    read by an underwriter who has to decide. The right is a phone: warm, roomy, one
    thing at a time. They do not share a visual language, and that is the point — a
    customer's bubble should never look like a record, and a record should never look
    like a chat.

    Tokens are declared on bare :root and redefined for dark. Nothing below sets a
    colour literal, so both themes resolve as a set.
  */
  :root {
    color-scheme: light;
    --ground: #eceff0;
    --paper: #ffffff;
    --paper-2: #f6f8f7;
    --rule: #dbe2df;
    --rule-soft: #eceeed;

    --ink: #0f1a16;
    --ink-2: #46554f;
    --ink-3: #5d6e68;

    --accent: #0b6b46;
    --accent-ink: #ffffff;
    --accent-wash: #e6f1ec;

    --flag: #8a5300;
    --flag-wash: #fbf1e0;
    --bad: #a4231d;
    --bad-wash: #fbecea;
    --good: #0b6b46;
    --good-wash: #e6f1ec;

    --room: #7f9bb8;
    --room-bar: #2b3742;
    --room-ink: #ffffff;
    --bubble-them: #ffffff;
    --bubble-me: #a9e263;
    --bubble-sys: rgba(15, 26, 22, .34);

    --shadow-1: 0 1px 2px rgba(15, 26, 22, .05);
    --shadow-2: 0 8px 28px rgba(15, 26, 22, .14);

    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;

    /* Dense scale. This is a console, not a page. */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --rail: 236px;
    --chat: 400px;
    --radius: 8px;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0e1513;
      --paper: #151d1a;
      --paper-2: #1b2421;
      --rule: #2a3531;
      --rule-soft: #212b28;

      --ink: #e8efeb;
      --ink-2: #a6b5af;
      --ink-3: #7d8d87;

      --accent: #3fbd85;
      --accent-ink: #06231a;
      --accent-wash: #17322a;

      --flag: #d5a45a;
      --flag-wash: #33291a;
      --bad: #e88a83;
      --bad-wash: #331e1d;
      --good: #3fbd85;
      --good-wash: #17322a;

      --room: #46596b;
      --room-bar: #101a20;
      --bubble-them: #232e2b;
      --bubble-me: #2f5a2a;
      --bubble-sys: rgba(0, 0, 0, .45);

      --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-2: 0 8px 28px rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0e1513;
    --paper: #151d1a;
    --paper-2: #1b2421;
    --rule: #2a3531;
    --rule-soft: #212b28;
    --ink: #e8efeb;
    --ink-2: #a6b5af;
    --ink-3: #7d8d87;
    --accent: #3fbd85;
    --accent-ink: #06231a;
    --accent-wash: #17322a;
    --flag: #d5a45a;
    --flag-wash: #33291a;
    --bad: #e88a83;
    --bad-wash: #331e1d;
    --good: #3fbd85;
    --good-wash: #17322a;
    --room: #46596b;
    --room-bar: #101a20;
    --bubble-them: #232e2b;
    --bubble-me: #2f5a2a;
    --bubble-sys: rgba(0, 0, 0, .45);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 8px 28px rgba(0, 0, 0, .55);
  }

  * { box-sizing: border-box; }
  /* The author rules below set display, which beats the UA rule for [hidden]. Without
     this line a `.hidden = true` in JS does nothing, and the desk offers an underwriter
     an approve button on a case the server will refuse. */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans);
    background: var(--ground); color: var(--ink);
    font-size: 13px; line-height: 1.55;
    display: grid; grid-template-columns: 1fr var(--chat); height: 100vh; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :where(button, input, a):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

  /* ═══════════════ back office ═══════════════ */

  .desk { display: grid; grid-template-rows: auto 1fr; min-width: 0; overflow: hidden; }

  .topbar {
    display: flex; align-items: center; gap: var(--s3);
    padding: 0 var(--s4); height: 46px;
    background: var(--paper); border-bottom: 1px solid var(--rule);
  }
  .topbar .mark {
    font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink); white-space: nowrap;
  }
  .topbar .mark span { color: var(--accent); }
  .topbar .crumb { font-size: 12px; color: var(--ink-3); }
  .topbar .spacer { flex: 1; }
  .link-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--ink-2); font-family: var(--mono);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.live { background: var(--good); box-shadow: 0 0 0 3px var(--good-wash); }
  .dot.down { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-wash); }

  .desk-body {
    display: grid; grid-template-columns: var(--rail) 1fr;
    min-height: 0; overflow: hidden;
  }

  /* ── queue rail: this is navigation, so it lives where navigation lives ── */
  .rail {
    background: var(--paper); border-right: 1px solid var(--rule);
    display: grid; grid-template-rows: auto 1fr; min-height: 0;
  }
  .rail-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--s3) var(--s3) var(--s2);
    border-bottom: 1px solid var(--rule-soft);
  }
  .rail-list { overflow-y: auto; padding: var(--s2) 0 var(--s5); }
  .qrow {
    display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s2);
    padding: 8px var(--s3); cursor: pointer; border-left: 3px solid transparent;
    transition: background 180ms ease, border-color 180ms ease;
  }
  .qrow:hover { background: var(--paper-2); }
  .qrow[aria-current="true"] { background: var(--accent-wash); border-left-color: var(--accent); }
  .qrow .who { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow .id { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .qrow .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; }

  /* ── case area ── */
  .case { overflow-y: auto; min-width: 0; padding-bottom: var(--s6); scroll-behavior: smooth; }

  /* Sticky so a decision never requires a scroll back up. */
  .case-head {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    padding: var(--s3) var(--s4) var(--s2);
  }
  .case-head::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: transparent;
  }
  .case-head[data-alert="review"]::before { background: var(--flag); }
  .case-head[data-alert="rejected"]::before { background: var(--bad); }
  .case-head[data-alert="approved"]::before { background: var(--good); }

  .case-title { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .case-title h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .case-title .num {
    font-family: var(--mono); font-size: 12px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  /* The stepper encodes a real sequence, so it is drawn as one: a connected rail. */
  .steps { display: flex; align-items: center; margin: var(--s3) 0 var(--s1); flex-wrap: wrap; gap: 2px 0; }
  .step { display: flex; align-items: center; gap: 6px; padding-right: 6px; }
  .step .bead {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    border: 1.5px solid var(--rule); background: var(--paper);
    font-size: 9px; font-family: var(--mono); color: var(--ink-3);
  }
  .step .name { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .step .bar { width: 14px; height: 1.5px; background: var(--rule); margin: 0 2px; }
  .step.done .bead { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step.done .name { color: var(--ink-2); }
  .step.done .bar { background: var(--accent); }
  .step.now .bead { border-color: var(--accent); border-width: 2px; color: var(--accent); font-weight: 700; }
  .step.now .name { color: var(--ink); font-weight: 600; }
  .step.bad .bead { background: var(--bad); border-color: var(--bad); color: var(--paper); }
  .step.bad .name { color: var(--bad); font-weight: 600; }

  .decide {
    display: flex; gap: var(--s2); align-items: center;
    margin-top: var(--s3); padding-top: var(--s3); border-top: 1px dashed var(--rule);
  }
  .decide label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--flag); font-weight: 700; white-space: nowrap; }
  .decide input { flex: 1; min-width: 0; }

  /* ── the strip a real service console leads with: whose book, and how big ── */
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
    gap: 1px; margin: var(--s3) var(--s4) 0;
    background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden;
  }
  .kpi { background: var(--paper); padding: 10px var(--s3); display: grid; gap: 2px; }
  .kpi .k { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
  .kpi .v { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1.2; }
  .kpi .v small { font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: 3px; }
  .kpi.alert .v { color: var(--flag); }

  .pnum { font-family: var(--mono); font-size: 11.5px; letter-spacing: .01em; white-space: nowrap; }
  .lapsed { color: var(--ink-3); }
  .lapsed .pname { text-decoration: line-through; text-decoration-color: var(--ink-3); }
  /* The contract behind the policy, one click away. A figure quoted in the chat is
     checkable against the page it came from, which is what separates a citation from
     a claim. */
  a.pname { color: inherit; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
  a.pname:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .lapsed a.pname { color: var(--ink-3); }
  .rider { display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; color: var(--ink-3); }
  .rider::before { content: "↳"; }

  /* ── the grid that stops the horizontal waste ── */
  .grid {
    display: grid; gap: var(--s3);
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    padding: var(--s3) var(--s4) 0;
    align-items: start;
  }
  .grid .wide { grid-column: 1 / -1; }
  @media (max-width: 1240px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .card {
    background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--shadow-1); overflow: hidden;
  }
  .card > header {
    display: flex; align-items: center; gap: var(--s2);
    padding: 9px var(--s3); border-bottom: 1px solid var(--rule-soft); background: var(--paper-2);
  }
  .card > header h3 {
    margin: 0; font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-2); font-weight: 700; display: flex; align-items: center; gap: 6px;
    white-space: nowrap; min-width: 0;
  }
  .card > header h3 svg { width: 13px; height: 13px; flex: none; color: var(--ink-3); }
  /* Same rule for a column head: a narrow column shrinks the label to one glyph per
     line otherwise, and 理 由 stacked vertically is not a table header. */
  thead th { white-space: nowrap; }
  .card > header .spacer { flex: 1; }
  .card > .body { padding: var(--s3); }
  .card > .body.flush { padding: 0; }
  .scroller { max-height: 320px; overflow-y: auto; }

  .label {
    font-size: 11px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 700;
  }
  .count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; letter-spacing: 0; }

  .kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px var(--s3); margin: 0; font-size: 13px; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kv dd.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .01em; }
  .kv dd.none { color: var(--ink-3); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0; background: var(--paper); z-index: 1;
    text-align: left; font-weight: 700; font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3);
    padding: 8px var(--s3) 6px; border-bottom: 1px solid var(--rule);
  }
  tbody td { padding: 7px var(--s3); border-bottom: 1px solid var(--rule-soft); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  td.mono { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Status carries a glyph as well as a colour, so it survives a colour-blind reader
     and a black-and-white print of the audit screen. */
  .pill {
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
    font-size: 11px; font-weight: 600; padding: 2px 8px 2px 6px; border-radius: 999px;
  }
  .pill svg { width: 11px; height: 11px; flex: none; }
  .pill.ok { background: var(--good-wash); color: var(--good); }
  .pill.no { background: var(--bad-wash); color: var(--bad); }
  .pill.wait { background: var(--paper-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--rule); }
  .pill.flag { background: var(--flag-wash); color: var(--flag); }

  .notice {
    display: flex; gap: var(--s2); align-items: flex-start;
    background: var(--flag-wash); border-left: 3px solid var(--flag);
    padding: 9px var(--s3); font-size: 12.5px; color: var(--ink);
    border-radius: 0 4px 4px 0; margin-top: var(--s3);
  }
  .notice svg { width: 14px; height: 14px; flex: none; margin-top: 2px; color: var(--flag); }
  .notice b { display: block; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--flag); margin-bottom: 2px; }

  /* Audit trail: a spine with beads, because it is a sequence of events in time. */
  .trail { margin: 0; padding: 0; list-style: none; font-size: 12.5px; }
  .trail li { position: relative; padding: 6px 0 6px var(--s4); }
  .trail li::before {
    content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1.5px; background: var(--rule);
  }
  .trail li:first-child::before { top: 13px; }
  .trail li:last-child::before { bottom: calc(100% - 13px); }
  .trail li::after {
    content: ""; position: absolute; left: 0; top: 10px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--paper); border: 2px solid var(--rule);
  }
  .trail li.latest::after { background: var(--accent); border-color: var(--accent); }
  .trail .what { font-weight: 500; }
  .trail .who { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  input, button { font-family: inherit; }
  input[type="text"], input:not([type]) {
    padding: 7px 10px; border: 1px solid var(--rule); border-radius: 5px;
    font-size: 12.5px; background: var(--paper); color: var(--ink);
    transition: border-color 180ms ease, box-shadow 180ms ease;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  input::placeholder { color: var(--ink-3); }

  button {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 500; padding: 7px 13px; border-radius: 5px;
    border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer;
    transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
  }
  button svg { width: 13px; height: 13px; }
  button:hover { background: var(--paper-2); border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { color: var(--bad); border-color: var(--bad); background: var(--paper); }
  button.danger:hover { background: var(--bad-wash); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 5px 8px; }
  button.ghost:hover { background: var(--paper-2); }

  .empty { color: var(--ink-3); font-size: 12.5px; padding: var(--s3); text-align: center; }
  td .empty, .body > .empty { padding: var(--s4) var(--s3); }

  /* ═══════════════ customer room ═══════════════ */

  /* min-height: 0 on both, or the log grows to fit its content and pushes the composer
     off the screen. A flex item's default min-height is auto, which refuses to shrink
     below the content — so `overflow-y: auto` on the log never gets a bounded height to
     scroll inside. */
  .chat { display: flex; flex-direction: column; background: var(--room); min-width: 0; min-height: 0; }
  .chat-top {
    background: var(--room-bar); color: var(--room-ink); padding: 0 var(--s3);
    height: 46px; display: flex; justify-content: space-between; align-items: center; gap: var(--s2);
  }
  .chat-top .who { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-top .who small { display: block; font-weight: 400; font-size: 11px; opacity: .65; font-family: var(--mono); }
  .chat-top button { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); color: var(--room-ink); font-size: 11.5px; padding: 5px 10px; }
  .chat-top button:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.4); }
  .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s4) var(--s3); display: flex; flex-direction: column; gap: var(--s2); }
  .msg {
    max-width: 80%; padding: 9px 12px; border-radius: 16px; font-size: 13.5px;
    line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow-1);
  }
  .msg.them { background: var(--bubble-them); color: var(--ink); border-top-left-radius: 4px; align-self: flex-start; }
  .msg.me { background: var(--bubble-me); color: #16300c; border-top-right-radius: 4px; align-self: flex-end; }
  .msg.sys {
    align-self: center; background: var(--bubble-sys); color: #fff; font-size: 11.5px;
    border-radius: 10px; padding: 4px 12px; box-shadow: none; max-width: 92%; text-align: center;
  }
  .msg.pending { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .msg.pending i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blip 1.2s infinite ease-in-out; }
  .msg.pending i:nth-child(2) { animation-delay: .18s; }
  .msg.pending i:nth-child(3) { animation-delay: .36s; }
  @keyframes blip { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .chat-in { display: flex; gap: 6px; padding: var(--s2); background: var(--paper); border-top: 1px solid var(--rule); }
  .chat-in input { flex: 1; min-width: 0; border-radius: 18px; padding: 9px 14px; font-size: 13.5px; }

  /* ── the enrolment card, and the chips under a reply ── */
  .setup {
    align-self: stretch; background: var(--paper); color: var(--ink);
    border-radius: 14px; padding: var(--s3) var(--s4) var(--s4); box-shadow: var(--shadow-1);
    display: grid; gap: var(--s3);
  }
  .setup h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .setup p { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .field { display: grid; gap: 5px; }
  .field > .label { font-size: 10.5px; }

  .segment { display: flex; gap: 6px; }
  .segment button {
    flex: 1; justify-content: center; padding: 8px;
    background: var(--paper-2); border-color: var(--rule);
  }
  .presets { display: grid; gap: 5px; }
  .presets button {
    text-align: left; display: block; padding: 8px 11px;
    background: var(--paper-2); border-color: var(--rule);
  }
  .presets button b { display: block; font-size: 12.5px; font-weight: 600; }
  .presets button small { display: block; font-size: 11px; color: var(--ink-3); line-height: 1.5; margin-top: 1px; }
  .presets button[aria-pressed="true"] {
    background: var(--accent-wash); border-color: var(--accent);
  }
  .presets button[aria-pressed="true"] b { color: var(--accent); }
  .presets button[aria-pressed="true"] small { color: var(--ink-2); }

  .segment button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600;
  }

  /* A combobox: type to narrow, or scroll the list. The occupation set is 27 long and
     grouped by 職業等級, which is the number that decides what can be sold. */
  .combo { position: relative; }
  .combo input { width: 100%; }
  .combo-list {
    position: absolute; inset: calc(100% + 4px) 0 auto 0; z-index: 20;
    max-height: 216px; overflow-y: auto;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
    box-shadow: var(--shadow-2);
  }
  .combo-group {
    padding: 6px var(--s3) 3px; font-size: 10px; letter-spacing: .1em;
    color: var(--ink-3); font-weight: 700; background: var(--paper-2);
    position: sticky; top: 0;
  }
  .combo-item { padding: 7px var(--s3); font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: var(--s2); }
  .combo-item:hover, .combo-item[aria-selected="true"] { background: var(--accent-wash); }
  .combo-item .cls { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .combo-item.none { color: var(--ink-3); cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 92%; }
  .chip {
    background: var(--paper); color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px; cursor: pointer;
    box-shadow: var(--shadow-1);
  }
  .chip:hover { background: var(--accent-wash); }

  /* ═══════════════ gate + modal ═══════════════ */

  .gate { position: fixed; inset: 0; background: rgba(9, 16, 13, .82); display: grid; place-items: center; z-index: 40; padding: var(--s4); }
  .gate .card { width: min(430px, 100%); box-shadow: var(--shadow-2); }
  .gate .body { padding: var(--s5); }
  .gate h3 { margin: 0 0 var(--s2); font-size: 18px; font-weight: 600; }
  .gate p { margin: 0 0 var(--s4); font-size: 12.5px; color: var(--ink-2); line-height: 1.75; }
  .gate label { display: block; margin-bottom: 5px; }
  .gate input { width: 100%; font-size: 14px; padding: 9px 12px; }
  .gate button { width: 100%; margin-top: var(--s3); padding: 10px; justify-content: center; }
  /* The alias row pairs a readonly input with a reroll button beside it, not stacked
     full-width like every other gate control — so it opts out of `.gate input`/`.gate button`. */
  .gate-row { display: flex; gap: 6px; }
  .gate-row input { flex: 1; min-width: 0; width: auto; font-size: 16px; letter-spacing: .08em; }
  .gate-row button { width: auto; margin-top: 0; padding: 9px 12px; }

  dialog {
    border: 1px solid var(--rule); border-radius: var(--radius); padding: 0;
    width: min(540px, 92vw); box-shadow: var(--shadow-2);
    background: var(--paper); color: var(--ink);
  }
  dialog::backdrop { background: rgba(9, 16, 13, .55); }
  .modal-head { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule); font-weight: 600; font-size: 14px; }
  .modal-body { padding: 0 var(--s4); max-height: 60vh; overflow-y: auto; }
  .modal-foot { padding: var(--s3) var(--s4); border-top: 1px solid var(--rule); display: flex; justify-content: flex-end; gap: var(--s2); }
  .doc-row { display: flex; align-items: center; gap: var(--s2); padding: 10px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
  .doc-row:last-child { border-bottom: 0; }
  .doc-row .name { flex: 1; min-width: 0; }

  /* ═══════════════ responsive ═══════════════ */

  /*
    Below the two-pane width the desk stacks above the chat, and vertical room becomes
    the scarce thing. The queue turns into a horizontal strip so it costs one row
    instead of six, and the case header stops being sticky — in a short viewport a
    sticky header eats the space the case itself needs.
  */
  @media (max-width: 1080px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(300px, 44vh); }
    .desk-body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .rail { border-right: 0; border-bottom: 1px solid var(--rule); grid-template-rows: auto auto; }
    .rail-list { display: flex; gap: var(--s2); overflow-x: auto; overflow-y: hidden; padding: var(--s2) var(--s3) var(--s3); }
    .qrow {
      flex: 0 0 auto; width: 196px; border-left: 0; border-bottom: 3px solid transparent;
      border-radius: 6px; background: var(--paper-2); align-content: start;
    }
    .qrow[aria-current="true"] { border-bottom-color: var(--accent); }
    .case-head { position: static; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    :root { --s4: 12px; --s5: 16px; }
    .case-head { padding: var(--s3); }
    .grid { padding: var(--s3) var(--s3) 0; }
    .kv { grid-template-columns: 82px minmax(0, 1fr); }
    .decide { flex-wrap: wrap; }
  }
</style>
</head>

<script>
const STAGES = [
  ["inquiry","詢問"],["proposed","提出方案"],["issued","交付文件"],
  ["signed","已簽署"],["verified","身分已驗"],["review","人工審核"],
];
const STAGE_NAMES = Object.fromEntries(STAGES.concat([["approved","已核准"],["rejected","已退件"]]));
const DESK_TOKEN = "__DESK_TOKEN__";
let caseId = null, customerWs = null, deskWs = null, pending = null, memberId = null;

/** Openers for a visitor who does not yet know what to ask. Questions, like every chip. */
const OPENERS = ["我想了解目前的保單保什麼", "想確認一年繳多少保費", "理賠要準備哪些文件？", "我想了解有沒有適合的方案"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortTime = (iso) => iso ? String(iso).slice(0,19).replace("T"," ") : "";
const icon = (name, w = 2) =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${name}"/></svg>`;

/** Status reads as a glyph plus a word, never as a colour alone. */
const PILLS = {
  ok:   (t) => `<span class="pill ok">${icon("check", 3)}${t}</span>`,
  no:   (t) => `<span class="pill no">${icon("x", 3)}${t}</span>`,
  wait: (t) => `<span class="pill wait">${icon("clock")}${t}</span>`,
  flag: (t) => `<span class="pill flag">${icon("alert")}${t}</span>`,
};

function bubble(kind, text) {
  const el = document.createElement("div");
  el.className = `msg ${kind}`;
  el.textContent = text;
  $("chatLog").append(el);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
  return el;
}

/** A turn takes several seconds, so the wait is shown rather than left blank. */
function waiting(on) {
  if (!on) { pending?.remove(); pending = null; return; }
  pending = document.createElement("div");
  pending.className = "msg them pending";
  pending.innerHTML = "<i></i><i></i><i></i>";
  $("chatLog").append(pending);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
}

function renderSteps(stage) {
  const idx = STAGES.findIndex(([k]) => k === stage);
  const decided = stage === "approved" || stage === "rejected";
  const drawn = STAGES.map(([key, label], i) => {
    const cls = decided || i < idx ? "done" : i === idx ? "now" : "";
    const bead = decided || i < idx ? icon("check", 3.5) : i + 1;
    return `<span class="step ${cls}"><span class="bead">${bead}</span><span class="name">${label}</span></span>`
         + (i < STAGES.length - 1 ? `<span class="step ${decided || i < idx ? "done" : ""}"><span class="bar"></span></span>` : "");
  });
  if (decided) {
    const ok = stage === "approved";
    drawn.push(`<span class="step ${ok ? "done" : "bad"}"><span class="bar"></span></span>`);
    drawn.push(`<span class="step ${ok ? "done" : "bad"}"><span class="bead">${icon(ok ? "check" : "x", 3.5)}</span><span class="name">${ok ? "已核准" : "已退件"}</span></span>`);
  }
  $("steps").innerHTML = drawn.join("");
}

function renderCase(c) {
  caseId = c.case_id;
  $("caseWho").textContent = c.display_name || "—";
  $("caseMeta").textContent = `#${c.case_id} · v${c.case_version}`;
  $("caseStage").textContent = STAGE_NAMES[c.stage] ?? c.stage;
  $("caseHead").dataset.alert = ["review","approved","rejected"].includes(c.stage) ? c.stage : "";
  $("caseBadge").innerHTML =
      c.stage === "review"   ? PILLS.flag("待人工審核")
    : c.stage === "approved" ? PILLS.ok("已核准")
    : c.stage === "rejected" ? PILLS.no("已退件")
    : PILLS.wait(STAGE_NAMES[c.stage] ?? c.stage);
  renderSteps(c.stage);

  const none = (v) => v ? esc(v) : `<span class="none">—</span>`;
  $("caseKv").innerHTML = `
    <dt>案件種類</dt><dd>${esc(c.kind)}</dd>
    <dt>責任業務員</dt><dd>${c.adviser_name ? esc(c.adviser_name) : '<span class="none">尚未指定</span>'}</dd>
    <dt>登錄字號</dt><dd class="mono">${none(c.adviser_licence)}</dd>
    <dt>決定人</dt><dd>${none(c.decided_by)}</dd>
    <dt>決定理由</dt><dd>${none(c.decision_reason)}</dd>
    <dt>快照時間</dt><dd class="mono">${shortTime(c.generated_at)}</dd>`;

  $("memberKv").innerHTML = `
    <dt>姓名</dt><dd>${esc(c.display_name)}</dd>
    <dt>身分證字號</dt><dd class="mono">${esc(c.national_id)}</dd>
    <dt>職業</dt><dd>${esc(c.occupation)}</dd>
    <dt>職業等級</dt><dd>第 ${c.occupation_class} 類</dd>`;

  renderPolicies(c.policies ?? [], c);

  const docs = c.documents ?? [];
  const signed = docs.filter(d => d.signed_at).length;
  $("docCount").textContent = docs.length ? `${signed}/${docs.length}` : "";
  $("docTable").innerHTML = docs.length ? docs.map(d => `
    <tr><td>${esc(d.kind)}</td>
        <td>${d.signed_at ? PILLS.ok("已簽署") : PILLS.wait("待簽署")}</td>
        <td class="mono">${shortTime(d.signed_at) || "—"}</td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">尚未交付</td></tr>`;

  const checks = c.identity_checks ?? [];
  $("idTable").innerHTML = checks.length ? checks.map(k => `
    <tr><td>${k.verified ? PILLS.ok("通過") : PILLS.no("未通過")}</td>
        <td>${esc(k.reason || "—")}</td>
        <td class="mono num">${k.latency_ms ?? "—"}ms</td>
        <td class="mono">${shortTime(k.checked_at)}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">尚未驗證</td></tr>`;

  const trail = (c.audit ?? []).slice().reverse();
  $("trailCount").textContent = trail.length || "";
  $("trail").innerHTML = trail.length ? trail.map((e, i) => `
    <li class="${i === 0 ? "latest" : ""}"><span class="what">${esc(e.action)}</span><br>
        <span class="who">${esc(e.actor)} · v${e.case_version ?? "—"} · ${shortTime(e.created_at)}</span></li>`).join("")
    : `<li class="empty">尚無事件</li>`;

  $("decideBox").hidden = c.stage !== "review";
  renderModalDocs(docs);
  $("docsBtn").hidden = docs.length === 0;
  markQueue();
}

const money = (n) => Number(n || 0).toLocaleString("zh-Hant-TW");

/**
 * The member's book, and the four figures a service console leads with.
 *
 * A policy is in force until its lapsed_at passes. A rider names the main contract it
 * hangs off, which the schema enforces with a foreign key — so the book always shows a
 * rider next to a main policy that exists.
 */
function renderPolicies(policies, c) {
  const today = (c.generated_at || "").slice(0, 10);
  const live = (p) => !p.lapsed_at || p.lapsed_at > today;
  const active = policies.filter(live);
  // A rider without its main policy is no longer a state the schema can hold — the FK
  // makes it impossible — so the only outstanding items are unsigned documents.
  const riders = policies.filter(p => p.main_policy_id);

  $("kpis").hidden = policies.length === 0;
  $("kpiActive").innerHTML = `${active.length}<small>張 / 共 ${policies.length}</small>`;
  $("kpiPremium").innerHTML = `${money(active.reduce((t, p) => t + Number(p.annual_premium || 0), 0))}<small>元</small>`;
  $("kpiSum").innerHTML = `${money(active.reduce((t, p) => t + Number(p.sum_insured || 0), 0))}<small>元</small>`;
  const todo = (c.documents ?? []).filter(d => !d.signed_at).length;
  $("kpiTodo").innerHTML = todo ? `${todo}<small>項</small>` : `0<small>項</small>`;
  $("kpiTodoBox").classList.toggle("alert", todo > 0);

  $("policyCount").textContent = policies.length
    ? `${active.length}/${policies.length} 有效${riders.length ? ` · 附約 ${riders.length}` : ""}` : "";
  $("policyTable").innerHTML = policies.length ? policies.map(p => `
    <tr class="${live(p) ? "" : "lapsed"}">
      <td class="pnum">${esc(p.policy_number)}</td>
      <td><a class="pname" href="/contract/${encodeURIComponent(p.product_id)}?token=${encodeURIComponent(DESK_TOKEN)}&member=${memberId}" target="_blank" title="開啟這張保單的契約條款">${esc(p.product_name)}</a>${
        p.main_policy_number ? `<br><span class="rider">主約 ${esc(p.main_policy_number)}</span>` : ""}</td>
      <td class="num">${money(p.sum_insured)}</td>
      <td class="num">${money(p.annual_premium)}</td>
      <td class="mono">${esc(p.effective_at)}</td>
      <td>${live(p) ? PILLS.ok("有效") : PILLS.no("已停效")}</td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">尚無保單</td></tr>`;
}

function renderModalDocs(docs) {
  $("modalDocs").innerHTML = docs.length ? docs.map(d => `
    <div class="doc-row">
      <span class="name">${esc(d.kind)}</span>
      ${d.signed_at
        ? PILLS.ok("已簽署")
        : `<button data-doc="${d.document_id}" class="dl">${icon("download")}下載</button>
           <button data-doc="${d.document_id}" class="up primary">${icon("upload")}上傳簽署本</button>`}
    </div>`).join("")
    : `<div class="empty">目前沒有待簽署文件。</div>`;
}

function markQueue() {
  for (const row of $("queueList").querySelectorAll("[data-case]")) {
    row.setAttribute("aria-current", String(Number(row.dataset.case) === caseId));
  }
}

function renderQueue(cases) {
  $("queueCount").textContent = cases.length || "";
  $("queueList").innerHTML = cases.length ? cases.map(c => `
    <div class="qrow" role="button" tabindex="0" data-case="${c.case_id}">
      <span class="who">${esc(c.display_name)}</span>
      <span class="id">#${c.case_id}</span>
      <span class="meta">${
        c.stage === "review" ? PILLS.flag("待審") :
        c.stage === "approved" ? PILLS.ok("核准") :
        c.stage === "rejected" ? PILLS.no("退件") :
        PILLS.wait(STAGE_NAMES[c.stage] ?? c.stage)
      }<span class="id">v${c.case_version}</span></span>
    </div>`).join("")
    : `<div class="empty">尚無案件</div>`;
  markQueue();
}

function setLink(state, text) {
  $("linkDot").className = `dot ${state}`;
  $("deskStatus").textContent = text;
}

/** A chip is a question, never a purchase. See renderChips. */
function renderChips(items) {
  document.querySelectorAll(".chips").forEach(el => el.remove());
  if (!items?.length) return;
  const box = document.createElement("div");
  box.className = "chips";
  box.innerHTML = items.map(t => `<button class="chip">${esc(t)}</button>`).join("");
  box.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    $("chatInput").value = chip.textContent;
    box.remove();
    send();
  });
  $("chatLog").append(box);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
}

/**
 * The enrolment card: the three fields that decide what can be sold.
 *
 * Sex, age and 職業等級 gate the product catalogue, so the visitor picks them rather
 * than receiving whatever a random seed drew. The occupation list is 27 long and
 * grouped by class, which is why it is a combobox and not a select.
 */
function renderSetup(draft) {
  const card = document.createElement("div");
  card.className = "msg them setup";
  card.innerHTML = `
    <h4>建立您的保戶資料</h4>
    <p>以下三項決定您能投保哪些商品。填好後按「完成建檔」，資料即固定，之後才能開始對話。</p>
    <div class="field">
      <span class="label">性別</span>
      <div class="segment" id="sexPick">
        <button type="button" data-sex="male" aria-pressed="${draft.sex === "male"}">男</button>
        <button type="button" data-sex="female" aria-pressed="${draft.sex === "female"}">女</button>
      </div>
    </div>
    <div class="field">
      <label class="label" for="agePick">年齡（18 至 85）</label>
      <input id="agePick" type="number" min="18" max="85" value="${draft.age}" inputmode="numeric">
    </div>
    <div class="field combo">
      <label class="label" for="occPick">職業（可直接輸入篩選）</label>
      <input id="occPick" autocomplete="off" value="${esc(draft.occupation)}" placeholder="輸入關鍵字，例如 司機">
      <div class="combo-list" id="occList" hidden></div>
    </div>
    <div class="field">
      <span class="label">既有保單</span>
      <div class="presets" id="presetPick">${(draft.presets ?? []).map((p, i) => `
        <button type="button" data-preset="${esc(p.key)}" aria-pressed="${i === 1}">
          <b>${esc(p.label)}</b><small>${esc(p.detail)}</small>
        </button>`).join("")}</div>
    </div>
    <button class="primary" id="enrolBtn" style="justify-content:center">完成建檔</button>`;
  $("chatLog").append(card);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;

  let sex = draft.sex;
  let occupation = draft.occupation;
  let preset = (draft.presets ?? [])[1]?.key ?? "basic";
  const options = draft.occupations ?? [];

  $("sexPick").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sex]");
    if (!b) return;
    sex = b.dataset.sex;
    for (const other of $("sexPick").children) other.setAttribute("aria-pressed", String(other === b));
  });

  $("presetPick").addEventListener("click", (e) => {
    const b = e.target.closest("[data-preset]");
    if (!b) return;
    preset = b.dataset.preset;
    for (const other of $("presetPick").children) other.setAttribute("aria-pressed", String(other === b));
  });

  const list = $("occList");
  const paint = (filter) => {
    const hits = options.filter(o => !filter || o.occupation.includes(filter) || o.label.includes(filter));
    if (!hits.length) { list.innerHTML = `<div class="combo-item none">查無這個職業，請換個關鍵字</div>`; return; }
    let group = null;
    list.innerHTML = hits.map(o => {
      const head = o.label === group ? "" : `<div class="combo-group">${esc(o.label)}</div>`;
      group = o.label;
      return `${head}<div class="combo-item" data-occ="${esc(o.occupation)}" aria-selected="${o.occupation === occupation}">
                <span>${esc(o.occupation)}</span><span class="cls">${o.occupation_class}</span></div>`;
    }).join("");
  };
  const open = () => { paint($("occPick").value.trim()); list.hidden = false; };
  $("occPick").addEventListener("focus", open);
  $("occPick").addEventListener("input", open);
  list.addEventListener("mousedown", (e) => {
    const item = e.target.closest("[data-occ]");
    if (!item) return;
    e.preventDefault();
    occupation = item.dataset.occ;
    $("occPick").value = occupation;
    list.hidden = true;
  });
  $("occPick").addEventListener("blur", () => setTimeout(() => { list.hidden = true; }, 120));

  $("enrolBtn").onclick = () => {
    // The typed text only counts when it names a real occupation. Anything else keeps
    // the drawn one rather than inventing a class the catalogue does not price.
    const typed = $("occPick").value.trim();
    const matched = options.find(o => o.occupation === typed);
    card.querySelectorAll("button, input").forEach(el => { el.disabled = true; });
    customerWs.send(JSON.stringify({
      type: "enrol",
      sex,
      age: Number($("agePick").value) || draft.age,
      occupation: matched ? matched.occupation : occupation,
      preset,
    }));
  };
}

function connectCustomer(name) {
  customerWs = new WebSocket(`ws://${location.host}/ws/customer`);
  customerWs.onopen = () => customerWs.send(JSON.stringify({ type: "hello", name }));
  customerWs.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (typeof m === "string") { bubble("sys", m); return; }
    switch (m.type) {
      case "draft":
        bubble("them", `${m.name} 您好，我是保險櫃台。\n開始之前，先麻煩您確認幾項基本資料。`);
        renderSetup(m);
        break;
      case "profile":
        memberId = m.member_id;
        $("chatWho").innerHTML = `${esc(m.name)}<small>保險年齡 ${m.insurance_age} · ${m.sex === "male" ? "男" : "女"} · 第 ${m.occupation_class} 類</small>`;
        bubble("them", m.returning
          ? `${m.name} 您好，歡迎回來。\n您的保戶資料為：${m.sex === "male" ? "男" : "女"}性、保險年齡 ${m.insurance_age} 歲、職業 ${m.occupation}（第 ${m.occupation_class} 類）。`
          : `建檔完成。\n${m.sex === "male" ? "男" : "女"}性、保險年齡 ${m.insurance_age} 歲、職業 ${m.occupation}（第 ${m.occupation_class} 類）。\n身分證字號 ${m.national_id}。\n資料已固定，請問需要什麼協助？`);
        $("chatInput").disabled = false;
        $("sendBtn").disabled = false;
        $("chatInput").focus();
        connectDesk();
        break;
      case "confirmed":
        bubble("sys", "身分核對通過");
        break;
      case "case": renderCase(m); break;
      case "reply":
        waiting(false);
        bubble("them", m.text);
        renderChips(m.quick);
        if (m.scenario) {
          const carried = Object.entries(m.params ?? {}).map(([k, v]) => `${k}=${v}`).join(" ");
          bubble("sys", `情境：${m.scenario}`
            + (carried ? ` · 取得 ${carried}` : "")
            + (m.citations?.length ? ` · 引用 ${m.citations.join("、")}` : ""));
        }
        if (m.faults?.length) bubble("sys", `引用查核未過：${m.faults.join("；")}`);
        break;
      case "notice": waiting(false); bubble("sys", m.text); break;
    }
  };
  customerWs.onclose = () => { waiting(false); bubble("sys", "連線已中斷"); };
}

function connectDesk() {
  deskWs = new WebSocket(`ws://${location.host}/ws/desk?token=${encodeURIComponent(DESK_TOKEN)}&member=${memberId}`);
  deskWs.onopen = () => setLink("live", "已連線 · 即時同步");
  deskWs.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "case") renderCase(m);
    if (m.type === "queue") renderQueue(m.cases ?? []);
    if (m.type === "notice") setLink("live", m.text);
  };
  deskWs.onclose = () => setLink("down", "後台連線中斷");
}

async function reroll() {
  try {
    const r = await fetch("/api/alias");
    $("nameInput").value = (await r.json()).alias;
  } catch { $("nameInput").value = ""; }
}
reroll();
$("rerollBtn").onclick = reroll;
$("ownNameBtn").onclick = () => {
  const box = $("nameInput");
  box.readOnly = false;
  box.value = "";
  box.placeholder = "自行輸入代號";
  box.focus();
  $("ownNameBtn").hidden = true;
};

$("enterBtn").onclick = () => {
  const name = $("nameInput").value.trim();
  if (!name) { $("nameInput").focus(); return; }
  $("gate").hidden = true;
  // The composer stays disabled until the profile exists. There is nothing to answer
  // a question against before then.
  connectCustomer(name);
};
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") $("enterBtn").click(); });

function send() {
  const text = $("chatInput").value.trim();
  if (!text || !customerWs) return;
  bubble("me", text);
  waiting(true);
  customerWs.send(JSON.stringify({ type: "say", text }));
  $("chatInput").value = "";
}
$("sendBtn").onclick = send;
$("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

$("docsBtn").onclick = () => $("docModal").showModal();
$("closeModal").onclick = () => $("docModal").close();
$("modalDocs").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-doc]");
  if (!button) return;
  const id = button.dataset.doc;
  if (button.classList.contains("dl")) {
    window.open(`/doc/${id}?token=${encodeURIComponent(DESK_TOKEN)}`, "_blank");
  } else {
    const input = document.createElement("input");
    input.type = "file";
    input.onchange = () => {
      customerWs.send(JSON.stringify({ type: "upload", document_id: Number(id), filename: input.files[0]?.name ?? "" }));
    };
    input.click();
  }
});

$("approveBtn").onclick = () => deskWs?.send(JSON.stringify({ type: "decide", case_id: caseId, approved: true, by: "核保人員" }));
$("rejectBtn").onclick = () => deskWs?.send(JSON.stringify({
  type: "decide", case_id: caseId, approved: false, reason: $("decideReason").value.trim(), by: "核保人員",
}));

/** The queue rail is navigation, so it answers the keyboard as well as the mouse. */
function openRow(el) {
  if (el) deskWs?.send(JSON.stringify({ type: "open", case_id: Number(el.dataset.case) }));
}
$("queueList").addEventListener("click", (e) => openRow(e.target.closest("[data-case]")));
$("queueList").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openRow(e.target.closest("[data-case]")); }
});
</script>
</body>
