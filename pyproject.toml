[project]
name = "policydesk"
version = "0.1.0"
description = "An insurance desk agent: quote, enrol, bill, cover, claim — every figure it states carries a citation back to the contract clause that produced it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "coseto6125", email = "cosetoenor@gmail.com" }]
keywords = ["insurance", "ai-agent", "claims", "taiwan", "fsc", "audit-trail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]

dependencies = [
  "sanic>=24.6",
  "msgspec>=0.18",
  "loguru>=0.7",
  "pypdf>=5.0",
  "uvloop>=0.20",
  "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
policydesk = "policydesk.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
